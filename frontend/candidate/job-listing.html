<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Jobs - AI Resume Matcher</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="candidate-style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }

    /* ── Page hero header ── */
    .browse-hero {
      padding: 2.5rem 0 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      margin-bottom: 2rem;
    }
    .browse-hero h1 {
      font-size: 2rem; font-weight: 800; color: #fff;
      letter-spacing: -0.02em; margin-bottom: 0.3rem;
    }
    .browse-hero h1 span {
      background: linear-gradient(135deg, #4a9eff, #00d4b0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .browse-hero p { font-size: 0.95rem; color: rgba(255,255,255,0.45); }

    /* ── Search & filter bar ── */
    .search-panel {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 16px;
      padding: 1.25rem 1.4rem;
      display: flex; gap: 0.9rem; align-items: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .search-field {
      flex: 1; min-width: 200px;
      display: flex; align-items: center; gap: 0.6rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 0.6rem 1rem;
      transition: border-color 0.2s;
    }
    .search-field:focus-within { border-color: rgba(74,158,255,0.5); }
    .search-field .search-icon { font-size: 0.95rem; opacity: 0.5; flex-shrink: 0; }
    .search-field input {
      background: none; border: none; outline: none;
      color: #fff; font-size: 0.9rem; width: 100%;
      font-family: inherit;
    }
    .search-field input::placeholder { color: rgba(255,255,255,0.3); }

    .filter-chip {
      display: flex; align-items: center; gap: 0.4rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 0.6rem 0.9rem;
      color: rgba(255,255,255,0.7); font-size: 0.85rem;
      cursor: pointer; font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
    }
    .filter-chip:hover { border-color: rgba(74,158,255,0.4); background: rgba(74,158,255,0.07); }
    select.filter-chip { cursor: pointer; outline: none; }
    select.filter-chip option { background: #1a1f3a; }

    .results-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.25rem;
    }
    .results-count { font-size: 0.85rem; color: rgba(255,255,255,0.4); }
    .results-count strong { color: #4a9eff; }

    /* ── Jobs grid ── */
    .jobs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    /* ── Job card ── */
    .jc {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 1.4rem;
      display: flex; flex-direction: column; gap: 1rem;
      transition: transform 0.22s, border-color 0.22s, box-shadow 0.22s;
      cursor: default;
    }
    .jc:hover {
      transform: translateY(-3px);
      border-color: rgba(74,158,255,0.3);
      box-shadow: 0 12px 35px rgba(0,0,0,0.3);
    }

    /* Card header */
    .jc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
    .jc-title { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: 0.2rem; line-height: 1.3; }
    .jc-company { font-size: 0.78rem; color: rgba(255,255,255,0.4); }

    .jc-type {
      flex-shrink: 0;
      padding: 0.22rem 0.65rem; border-radius: 20px;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.3px;
      background: rgba(74,158,255,0.12); color: #4a9eff;
      border: 1px solid rgba(74,158,255,0.25);
      white-space: nowrap;
    }
    .jc-type.CONTRACT { background: rgba(245,158,11,0.12); color: #f59e0b; border-color: rgba(245,158,11,0.3); }
    .jc-type.PART_TIME { background: rgba(139,92,246,0.12); color: #a78bfa; border-color: rgba(139,92,246,0.3); }
    .jc-type.INTERNSHIP { background: rgba(16,185,129,0.12); color: #34d399; border-color: rgba(16,185,129,0.3); }

    /* Meta row */
    .jc-meta { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .jc-meta-item {
      display: flex; align-items: center; gap: 0.35rem;
      font-size: 0.8rem; color: rgba(255,255,255,0.5);
    }
    .jc-meta-item .ico { font-size: 0.85rem; }
    .jc-salary { color: #4ade80 !important; font-weight: 600; }

    /* Skills */
    .jc-skills { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .jc-skill {
      background: rgba(74,158,255,0.08); border: 1px solid rgba(74,158,255,0.18);
      color: #93c5fd; font-size: 0.72rem; padding: 0.18rem 0.55rem; border-radius: 20px;
    }
    .jc-skill.more { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.4); border-color: rgba(255,255,255,0.12); }

    /* Description */
    .jc-desc {
      font-size: 0.83rem; color: rgba(255,255,255,0.45);
      line-height: 1.55; flex: 1;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Actions */
    .jc-actions { display: flex; gap: 0.6rem; margin-top: auto; }
    .jc-btn-outline {
      flex: 1; padding: 0.55rem; border-radius: 9px; font-size: 0.83rem; font-weight: 600;
      border: 1.5px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.75); cursor: pointer; font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
    }
    .jc-btn-outline:hover { border-color: rgba(74,158,255,0.4); background: rgba(74,158,255,0.07); }

    .jc-btn-apply {
      flex: 1; padding: 0.55rem; border-radius: 9px; font-size: 0.83rem; font-weight: 700;
      border: none; background: linear-gradient(135deg, #4a9eff, #0066ff);
      color: #fff; cursor: pointer; font-family: inherit;
      transition: opacity 0.2s, transform 0.15s;
    }
    .jc-btn-apply:hover { opacity: 0.88; transform: translateY(-1px); }
    .jc-btn-apply:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Empty / loading */
    .jc-empty {
      grid-column: 1/-1; text-align: center; padding: 5rem 2rem;
      color: rgba(255,255,255,0.35); font-size: 0.95rem;
    }
    .jc-empty .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container navbar-container">
      <div class="nav-brand">
        <span class="nav-brand-link">
          <img src="../images/logo.png" alt="AI Resume Matcher Logo" class="nav-logo">
          <h2 class="gradient-text">AI Resume Matcher</h2>
        </span>
      </div>
      <ul class="nav-menu">
        <li><a href="job-listing.html" class="active">Browse Jobs</a></li>
        <li><a href="resume-upload.html">My Resume</a></li>
        <li><a href="applications.html">My Applications</a></li>
        <li><a href="profile.html">My Profile</a></li>
        <li><a href="../index.html" id="logoutBtn">Logout</a></li>
      </ul>
    </div>
  </nav>

  <div class="page-container">
    <div class="container">

      <!-- Hero header -->
      <div class="browse-hero">
        <h1>Browse <span>Job Opportunities</span></h1>
        <p>Find your perfect match — AI-ranked positions based on your skills and experience.</p>
      </div>

      <!-- Search + Filter panel -->
      <div class="search-panel">
        <div class="search-field">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Search by title or skill..." oninput="filterJobs()">
        </div>
        <select class="filter-chip" id="locationFilter" onchange="filterJobs()">
          <option value="all">📍 All Locations</option>
          <option value="kuala lumpur">Kuala Lumpur</option>
          <option value="selangor">Selangor</option>
          <option value="penang">Penang</option>
          <option value="johor">Johor Bahru</option>
          <option value="remote">Remote</option>
        </select>
        <select class="filter-chip" id="typeFilter" onchange="filterJobs()">
          <option value="all">💼 All Types</option>
          <option value="FULL_TIME">Full-time</option>
          <option value="PART_TIME">Part-time</option>
          <option value="CONTRACT">Contract</option>
          <option value="INTERNSHIP">Internship</option>
        </select>
      </div>

      <!-- Results bar -->
      <div class="results-bar">
        <div class="results-count" id="resultsCount"></div>
      </div>

      <!-- Jobs grid — populated by job-api.js -->
      <div class="jobs-grid" id="jobsGrid">
        <div class="jc-empty">
          <div class="icon">⏳</div>
          <p>Loading available jobs...</p>
        </div>
      </div>

    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    window.auth.requireAuth();
    document.getElementById('logoutBtn')?.addEventListener('click', e => {
      e.preventDefault(); window.auth.logout();
    });
  </script>
  <script src="job-api.js"></script>
  <script src="candidate-main.js"></script>
</body>
</html>
